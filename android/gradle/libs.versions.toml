[versions]
agp = "9.4.1"
kotlin = "2.4.10"
composeBom = "2026.11.01"
activityCompose = "1.13.0"
meshtasticSdk = "0.2.0"
coroutines = "1.11.0"
protobuf = "4.28.3"
protobufPlugin = "0.9.5"
snakeyaml = "2.3"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
meshtastic-sdk-core = { module = "org.meshtastic:sdk-core", version.ref = "meshtasticSdk" }
meshtastic-sdk-transport-ble = { module = "org.meshtastic:sdk-transport-ble", version.ref = "meshtasticSdk" }
meshtastic-sdk-transport-tcp = { module = "org.meshtastic:sdk-transport-tcp", version.ref = "meshtasticSdk" }

protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
