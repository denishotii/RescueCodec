[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuecodec"
version = "0.1.0"
description = "Local semantic emergency messaging prototype for constrained mesh links"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]
radio = ["meshtastic>=2.6"]

[project.scripts]
rescuecodec = "rescuecodec.api:run"
rescuecodec-benchmark = "rescuecodec.benchmark.run:main"

[tool.setuptools.packages.find]
include = ["rescuecodec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
