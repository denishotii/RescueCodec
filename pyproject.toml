[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuecodec"
version = "0.1.0"
description = "Local semantic emergency messaging prototype for constrained mesh links"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30", "pydantic>=2.8", "websockets>=13", "pyyaml>=6", "protobuf>=6.33"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.20"]
radio = ["meshtastic>=2.7.11", "protobuf>=5"]
mqtt = ["paho-mqtt>=2.1"]
gateway = ["meshtastic>=2.7.11", "protobuf>=5", "paho-mqtt>=2.1"]
all = ["pytest>=8", "httpx>=0.27", "meshtastic>=2.7.11", "protobuf>=5", "paho-mqtt>=2.1"]

[project.scripts]
rescuecodec = "rescuecodec.api:run"
rescuecodec-gateway = "rescuecodec.gateway.cli:main"
rescuecodec-benchmark = "rescuecodec.benchmark.run:main"

[tool.setuptools.packages.find]
include = ["rescuecodec*"]

[tool.setuptools.package-data]
"rescuecodec.gateway" = ["docs/*", "static/*.html", "static/*.svg", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
