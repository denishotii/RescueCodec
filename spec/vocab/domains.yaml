# RescueCodec domain vocabularies for the 0x03 domain frame. Licence of this file: Apache-2.0.
# Generated by spec/tools/domain_vocab.py (reproducible; inputs listed under `sources`). Do not edit by hand:
# the vocabulary files are frozen like the word dictionaries (a change is a new id).
#
# Frame (port 256):  0x03 | vocabulary id (1 byte) | bit stream of N-bit codes, MSB first, last byte zero-padded.
# N follows from the id (table below). The decoder stops when fewer than N bits remain (padding is < 8 <= N).
# Code c < 2^N - 8: entry c = line c+1 of the vocabulary file (ID 0 is the first line).
# Controls: the top 8 codes of the code space, base = 2^N - 8:
#   base+0 ESC16  the next 16 bits are a token of word dictionary 2 (0x0000..0xEFFF; 0xF000.. is malformed)
#   base+1 CAP    the next entry (or escaped token) with its first a-z written A-Z
#   base+2 UPPER  the next entry (or escaped token) with every a-z written A-Z
#   base+3 GLUE   no space before the next entry
#   base+4 LIT    the next 8 bits are a length L = 1..255 (0 is malformed), then L bytes of UTF-8, copied exactly
#   base+5..base+7 reserved (malformed)
# Spaces, punctuation and literal ownership: exactly as SPEC 3.6.3 (an entry and an escaped token are both
# 'entries'; a literal carries its own spaces). Files: one entry per line, UTF-8, LF, ending with LF, printable
# ASCII, no leading/trailing space, no duplicates. `.gitattributes` keeps the bytes exact; check the SHA-256.

format: 1
reserved_codes: 8
controls: [ESC16, CAP, UPPER, GLUE, LIT, reserved, reserved, reserved]   # offsets 0..7 from 2^N - 8
general_dictionary: {file: words-dict-v2.txt, version: 2, sha256: c88c6b6bd08821b150a248c41f10b99c71ee5f34ab40d6840685738eb8f48dee}

