openapi: 3.1.0
info:
  title: RescueCodec Gateway API
  version: 2.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  summary: Local REST and WebSocket API of the RescueCodec gateway (command post laptop or Raspberry Pi).
  description: |
    The gateway sits next to a Meshtastic radio (USB, Wi-Fi or the simulator). It decodes every
    RescueCodec packet it hears and sends packets for you. Our own dashboard uses only this API,
    so anything the dashboard does, your software can do too.

    **Basics**
    - Base URL: `http://127.0.0.1:8000` by default. Everything is under `/v2`. No internet needed.
    - JSON everywhere, UTF-8. Times are ISO 8601 in UTC, for example `2026-11-25T14:32:05Z`.
    - Messages use the **canonical JSON** of the spec (`spec/SPEC.md`, section "Canonical JSON").
      The same JSON goes into `POST /v2/messages`, comes out of `GET /v2/messages`, and is used on MQTT.
    - Node ids look like `!a1b2c3d4` (Meshtastic style, 8 lowercase hex digits).
    - A **task key** names a message that can be answered: `<node hex>-<id>`, for example `a1b2c3d4-7`.
    - Authentication: none by default, because the gateway listens on localhost only. The gateway refuses
      to listen on any other address unless it has a token (`--token`). With a token every `/v2` call needs
      `Authorization: Bearer <token>`, and the WebSocket and the dashboard take `?token=<token>` because
      browsers cannot set headers there. A WebSocket from a web page must come from localhost, from
      `--cors-origin`, or (with a token) from the gateway's own address. Programs without an `Origin` are fine.
    - The API may queue at most 30 messages per minute (`--tx-per-minute`). More gives `429 rate_limited`.
    - Wording: `delivered` means a neighbouring radio repeated our packet. It does not mean that a team
      received it. The `ack` from a person is the proof of that.

    **Sending is asynchronous.** `POST` returns `202` with a record in status `queued`. The status then
    moves to `sent` (handed to the radio), and for `want_ack` packets to `delivered` (Meshtastic
    acknowledged it) or `failed`. Watch it on the WebSocket (`message_status` events) or poll
    `GET /v2/messages/{seq}`. Mayday goes first in the queue, then the order follows the priority.

    **Numbers in `/v2/stats`** carry `source: measured` (counted bytes, radio readings) or
    `source: estimated` (airtime calculated with the LoRa formula and Meshtastic's overhead).

    **Channels and direct messages.** The gateway listens on every private channel of its radio (`--channels all`,
    the default, or `--channels NAME,NAME`) and keeps every direct message to its own node. Public channels (no key
    or the default key, for example LongFast) are ignored unless the gateway runs with `--show-public`. A channel is
    known by its **name**; an empty primary name shows as the modem preset's name ("LongFast"). Every record has
    `channel: {index, name, public}` and `to` (the peer of a direct message, else null). You send on the default
    channel (`--channel-name`, default RescueCodec) unless you name one with `channel`; `to` sends a direct message
    (a text only). Answers (`POST /v2/tasks/{key}/ack`) always go out on the channel of the report they
    answer. `GET /v2/health` lists the channels in `radio.channels`.

    **Plain Meshtastic texts** (SPEC section 2.1). The gateway also shows normal Meshtastic texts (port 1,
    TEXT_MESSAGE_APP), for example from the official app: a broadcast on a channel it listens on, or a direct message
    to the gateway's radio. Texts on public channels (the LongFast chat) are not shown without `--show-public`. Such a record is a
    normal `text` record with `codec.version: 0`; `codec.hex` holds the UTF-8 bytes of the text.

    **Packed texts** (SPEC sections 2.3 and 3.5). A text that you send goes out in one of two ways, and the gateway
    picks per chat (a channel, or a direct chat with one node):
    - **packed for RescueCodec**: a RescueCodec text on port 256 whose words are compressed with DEFLATE and a shared
      dictionary, about 40 % smaller, with id and position. Stock Meshtastic apps cannot read it.
    - **normal Meshtastic text** (port 1): only the words, readable by every app and radio screen.
    Each chat has a mode: `auto` (default, `--text-mode`), `compressed` or `normal` (`PUT /v2/channels/{name}/mode`,
    `PUT /v2/nodes/{node}/mode`). Auto packs a channel text when no stock Meshtastic user (a node that sent port 1
    texts there and no RescueCodec packet) was heard on that channel for 24 h, and a direct text when the peer sent a
    RescueCodec packet in the last 24 h. Public channels always get normal text. A text is packed only when the packet
    is at least 3 bytes smaller than the normal text. A received packed text shows its words like any other text, with
    `codec.packed: true` and `message.text.dict`.

    **Compact texts** (SPEC section 3.6, opt-in with `--compact-text on`, default off). In a chat that packs, the
    gateway also builds the word-token form (2-byte tokens from the word dictionary, names and numbers as exact
    literals) and sends it when its whole packet is smaller than what the rule above picked; a tie keeps the existing
    form. Never on a public channel or to a stock Meshtastic user. Received compact texts are shown like any other
    text, whatever the flag says: `codec.packed: true`, `codec.form: words` and `message.text.words`. A compact text
    with a word dictionary this gateway does not have is a record of type `unknown` with `message.unknown.words`
    and the readable line "Message encoded with a dictionary this app does not have".

    **Text limits.** A chat that packs (`send_as: compressed`) takes up to 400 bytes of UTF-8; the packet stays at most
    200 bytes, and a text that does not fit one packet is cut to the longest prefix that fits and ends with "…". Any
    other chat takes up to 180 bytes (`GET /v2/health` -> `text_limits`). There is no multipart message.

    **Other connectors** (not part of this HTTP API, same JSON): MQTT topic `rescuecodec/v2/messages`
    carries `MessageRecord` objects, `rescuecodec/v2/channels/<channel name>` the same records per channel, and
    `rescuecodec/v2/tasks` carries `Task` objects. The TAK
    connector sends CoT markers. The readable-text connector (`--text-over-air`) posts `text.en` on the
    Meshtastic text port, with `[RC] ` in front so RescueCodec receivers skip the copy.
servers:
  - url: http://127.0.0.1:8000
    description: Gateway on this computer
tags:
  - name: send
  - name: read
  - name: tasks
  - name: tools
  - name: system
paths:
  /v2/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Is the gateway up and is a radio connected?
      responses:
        "200":
          description: Always 200 while the gateway runs. Check `status` and `radio.connected`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                ok:
                  value:
                    status: ok
                    version: 2.0.0
                    spec_version: 2.0.0
                    uptime_s: 3605
                    radio:
                      connected: true
                      kind: serial
                      node: "!a1b2c3d4"
                      port: 256
                      channel: RescueCodec
                      region: EU_868
                      preset: LONG_FAST
                      firmware: 2.7.26
                    mqtt: { connected: false }
                no_radio:
                  value:
                    status: degraded
                    version: 2.0.0
                    spec_version: 2.0.0
                    uptime_s: 12
                    radio: { connected: false, kind: none, node: null, port: 256, channel: null, channels: [], region: null, preset: null, firmware: null }
                    mqtt: { connected: false }

  /v2/messages:
    post:
      tags: [send]
      operationId: sendMessage
      summary: Send a report (any message type) over the mesh.
      description: |
        Send one canonical JSON message. Leave out `id`: the gateway assigns the next id of its own
        counter (types that can be answered always get one). If you give an `id`, it is used as is.
        Use `POST /v2/tasks/{key}/ack` to answer a task, not this endpoint.
        A text message that is over 200 bytes only with its position and id is cut to fit and ends with "…",
        like on the phone. The returned record shows the text that goes out.
        A message with a `text` body goes out packed for RescueCodec (port 256, with id and `pos`) or as a normal
        Meshtastic text (port 1, TEXT_MESSAGE_APP, only the words), as the chat's text mode says (see "Packed texts"
        above and `GET /v2/channels/{name}/mode`). Both use the same queue, priority, airtime budget and `want_ack`.
        A normal text record has `codec.version: 0` and no `key`; a packed one has `codec.packed: true` and
        `codec.form` (`deflate` or `words`). A `dict` or `words` in the text body is ignored: the chat's mode and
        `--compact-text` decide. The words may be up to 400 bytes in a chat that packs, else 180 (see "Text limits").
        With `dry_run: true` nothing is sent; you get the record as it would be queued.
        `channel` picks a channel by name (one of `GET /v2/health` -> `radio.channels`); without it the message goes
        out on the default channel. Reports never go out on a public channel. `to` makes a text a direct message to
        that node: packed when the node runs RescueCodec, else a normal Meshtastic text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRequest" }
            examples:
              found:
                summary: Child found with GPS
                value:
                  message:
                    pos: { lat: 50.69212, lon: 7.21345 }
                    found: { age: child, consciousness: conscious, injuries: [hypothermia, fracture], needs: [stretcher], responders: 2 }
              mayday:
                summary: SOS button
                value:
                  message: { pos: { lat: 50.69212, lon: 7.21345 }, mayday: { reason: injured, persons: 1 } }
              track:
                summary: Three track points
                value:
                  message:
                    time: "14:30"
                    track: { points: [ { lat: 50.69212, lon: 7.21345, s: 5 }, { lat: 50.6925, lon: 7.2139, s: 35 }, { lat: 50.69291, lon: 7.21422, s: 65 } ] }
              request:
                value:
                  message: { pos: { lat: 50.69212, lon: 7.21345 }, request: { resource: searchers, count: 10, urgency: now } }
              channel:
                summary: A text on another channel
                value:
                  message: { text: { text: "Trage kommt in 10 min" } }
                  channel: draeger-srs
              direct:
                summary: A direct message to one radio
                value:
                  message: { text: { text: "Bitte melden" } }
                  to: "!a1b2c3d4"
      responses:
        "202":
          description: Queued. Follow the status on the WebSocket or with GET /v2/messages/{seq}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageRecord" }
              examples:
                queued: { $ref: "#/components/examples/OutFoundRecord" }
        "400": { $ref: "#/components/responses/InvalidMessage" }
        "429": { $ref: "#/components/responses/AirtimeLimit" }
        "503": { $ref: "#/components/responses/RadioUnavailable" }
    get:
      tags: [read]
      operationId: listMessages
      summary: List received and sent messages, newest last.
      parameters:
        - name: since_seq
          in: query
          description: Only records with `seq` greater than this. Use the last `seq` you saw to page or to catch up.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: type
          in: query
          description: Filter by message type. Comma separated, for example `found,mayday`.
          schema: { type: string, example: "found,mayday" }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
        - name: channel
          in: query
          description: Only these channels, by name. Comma separated, compared without case.
          schema: { type: string, example: "RescueCodec,draeger-srs" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Records in ascending `seq`. `next_since_seq` is the `seq` to pass next time.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_since_seq]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MessageRecord" }
                  next_since_seq: { type: integer }
              examples:
                one:
                  value:
                    items: [ {"seq": 42, "key": "a1b2c3d4-7", "direction": "in", "from": "!a1b2c3d4", "type": "found", "priority": "urgent", "status": "received", "error": null, "time": "2026-11-25T14:32:05Z", "event_time": null, "codec": {"version": 2, "size": 23, "hex": "08071a0908b8e6ea041082875832080841100518012802"}, "radio": {"packet_id": 3141592653, "rssi": -97, "snr": 6.25, "hops": 0, "channel": 1, "via": "serial"}, "channel": {"index": 1, "name": "RescueCodec", "public": false}, "to": null, "message": {"id": 7, "pos": {"lat": 50.69212, "lon": 7.21345}, "found": {"consciousness": "conscious", "age": "child", "injuries": ["hypothermia", "fracture"], "needs": ["stretcher"], "responders": 2}}, "text": {"en": "Person found: child, conscious, hypothermia, fracture, needs stretcher, 2 more helpers needed. Position 50.69212, 7.21345.", "de": "Person gefunden: Kind, ansprechbar, Unterkühlung, Knochenbruch, braucht Trage, 2 weitere Helfer benötigt. Position 50.69212, 7.21345."}, "task_key": "a1b2c3d4-7"} ]
                    next_since_seq: 42

  /v2/messages/{seq}:
    get:
      tags: [read]
      operationId: getMessage
      summary: One message record.
      parameters:
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageRecord" }
              examples:
                incoming: { $ref: "#/components/examples/InFoundRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/text:
    post:
      tags: [send]
      operationId: sendText
      summary: Send a short free text (packed for RescueCodec or a normal Meshtastic text, per chat).
      description: |
        Shortcut for `POST /v2/messages` with a `text` body. 1 to 180 bytes of UTF-8, or up to 400 bytes in a chat
        that packs (`send_as: compressed`); what does not fit one 200-byte packet is cut and ends with "…".
        The chat's text mode decides how it goes out (see "Packed texts" above): packed for RescueCodec (port 256),
        which stock apps do not show, or a normal Meshtastic text (port 1), which every app shows; `also_plain` then
        changes nothing. To reach stock apps with a packed text anyway, set `also_plain: true`: the gateway then also
        posts `[RC] ` plus the text on the normal text port (TEXT_MESSAGE_APP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 400, description: "1..180 bytes of UTF-8; up to 400 bytes in a chat that packs (send_as compressed). The gateway checks bytes, maxLength is the character bound." }
                priority: { $ref: "#/components/schemas/Priority" }
                also_plain: { type: boolean, default: false }
                channel: { type: string, description: "Channel name to send on. Default: the default channel." }
                to: { type: string, pattern: "^![0-9a-f]{8}$", description: "Send as a direct message to this node (packed if it runs RescueCodec)." }
            example: { text: "Treffpunkt jetzt am Gasthaus, nicht am Parkplatz" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageRecord" }
        "400": { $ref: "#/components/responses/InvalidMessage" }
        "429": { $ref: "#/components/responses/AirtimeLimit" }
        "503": { $ref: "#/components/responses/RadioUnavailable" }

  /v2/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Messages that wait for an answer (found, request, hazard, mayday) with their state.
      description: Sorted by priority (critical first), then by creation time (oldest first).
      parameters:
        - name: state
          in: query
          description: Comma separated, for example `open,accepted`. Default all.
          schema: { type: string, example: "open,accepted" }
        - name: type
          in: query
          schema: { type: string, example: "found,mayday" }
        - name: channel
          in: query
          description: Only these channels, by name. Comma separated, compared without case.
          schema: { type: string, example: "RescueCodec,draeger-srs" }
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
              examples:
                one:
                  value:
                    items: [ {"key": "a1b2c3d4-7", "from": "!a1b2c3d4", "id": 7, "type": "found", "priority": "urgent", "state": "accepted", "created": "2026-11-25T14:32:05Z", "updated": "2026-11-25T14:33:10Z", "pos": {"lat": 50.69212, "lon": 7.21345}, "text": {"en": "Person found: child, conscious, hypothermia, fracture, needs stretcher, 2 more helpers needed. Position 50.69212, 7.21345.", "de": "Person gefunden: Kind, ansprechbar, Unterkühlung, Knochenbruch, braucht Trage, 2 weitere Helfer benötigt. Position 50.69212, 7.21345."}, "message_seq": 42, "channel": {"index": 1, "name": "RescueCodec", "public": false}, "acks": [{"by": "!0badc0de", "status": "accepted", "eta": 15, "team": "Trupp 3", "time": "2026-11-25T14:33:10Z", "seq": 45}]} ]

  /v2/tasks/{key}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task.
      parameters:
        - $ref: "#/components/parameters/TaskKey"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
              examples:
                accepted: { $ref: "#/components/examples/AcceptedTask" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/tasks/{key}/ack:
    post:
      tags: [tasks, send]
      operationId: ackTask
      summary: Accept, decline or finish a task. Sends an Ack over the mesh.
      description: |
        Sends `{"ack": {"ref": <id>, "node": <sender>, "status": ..., "eta": ..., "team": ...}}` as a
        broadcast on the task's channel (the channel the report came in on, `task.channel`), so the sender and
        everyone else there sees who took the task. The task state
        changes right away; the returned `record` shows the radio status. Your Ack counts as one more team's
        answer (SPEC section 15): when another team still has the task accepted, your decline leaves it accepted.
        Allowed moves: open -> accepted | declined; accepted -> done | declined; declined -> accepted.
        Repeating the current state is allowed (resends the Ack). Other moves give 409.
      parameters:
        - $ref: "#/components/parameters/TaskKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
            examples:
              accept: { value: { status: accepted, eta: 15, team: "Trupp 3" } }
              done: { value: { status: done } }
      responses:
        "202":
          description: Task updated, Ack queued.
          content:
            application/json:
              schema:
                type: object
                required: [task, record]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  record: { $ref: "#/components/schemas/MessageRecord" }
        "400": { $ref: "#/components/responses/InvalidMessage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not an allowed state change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_transition, message: "task is done; cannot change to accepted", field: status } }
        "429": { $ref: "#/components/responses/AirtimeLimit" }
        "503": { $ref: "#/components/responses/RadioUnavailable" }

  /v2/stats:
    get:
      tags: [read]
      operationId: getStats
      summary: Traffic, size savings and airtime, each number marked measured or estimated.
      responses:
        "200":
          description: Stats since the gateway started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
              examples:
                running: { $ref: "#/components/examples/Stats" }

  /v2/nodes:
    get:
      tags: [read]
      operationId: listNodes
      summary: Mesh nodes the gateway radio knows (from Meshtastic's node list).
      responses:
        "200":
          description: Nodes, most recently heard first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
              example:
                items:
                  - node: "!a1b2c3d4"
                    num: 2712847316
                    short_name: T1K1
                    long_name: Trupp 1 T1000-E
                    hw_model: TRACKER_T1000_E
                    role: CLIENT_MUTE
                    last_heard: "2026-11-25T14:32:05Z"
                    rssi: -97
                    snr: 6.25
                    hops_away: 0
                    battery_pct: 81
                    pos: { lat: 50.69212, lon: 7.21345 }
                    is_gateway: false

  /v2/channels/{name}/mode:
    get:
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: "Channel name, any case, for example RescueCodec." }
      tags: [send]
      operationId: getChannelMode
      summary: How a text on this channel goes out now (packed or normal), and why.
      responses:
        "200":
          description: The text mode of the channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMode" }
              example: { channel: RescueCodec, node: null, mode: auto, own_mode: false, send_as: normal, reason: meshtastic_users,
                         meshtastic_users: ["!0000e003"], rescuecodec_nodes: ["!0000e002"] }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: "Channel name, any case, for example RescueCodec." }
      tags: [send]
      operationId: setChannelMode
      summary: Set the text mode of a channel (auto, compressed or normal; null = the gateway default).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeRequest" }
            example: { mode: compressed }
      responses:
        "200":
          description: The new text mode. It is stored and survives a restart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMode" }
        "400": { $ref: "#/components/responses/InvalidMessage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v2/nodes/{node}/mode:
    get:
      parameters:
        - { name: node, in: path, required: true, schema: { type: string, pattern: "^![0-9a-f]{8}$" }, description: "Peer of the direct chat." }
      tags: [send]
      operationId: getDirectChatMode
      summary: How a direct text to this node goes out now.
      responses:
        "200":
          description: The text mode of the direct chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMode" }
              example: { channel: null, node: "!0000e002", mode: auto, own_mode: false, send_as: compressed, reason: peer_rescuecodec,
                         meshtastic_users: [], rescuecodec_nodes: ["!0000e002"] }
        "400": { $ref: "#/components/responses/InvalidMessage" }
    put:
      parameters:
        - { name: node, in: path, required: true, schema: { type: string, pattern: "^![0-9a-f]{8}$" }, description: "Peer of the direct chat." }
      tags: [send]
      operationId: setDirectChatMode
      summary: Set the text mode of a direct chat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeRequest" }
      responses:
        "200":
          description: The new text mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMode" }
        "400": { $ref: "#/components/responses/InvalidMessage" }

  /v2/export.geojson:
    get:
      tags: [read]
      operationId: exportGeoJson
      summary: Finds, hazards, maydays, requests (points) and tracks (lines) as GeoJSON.
      description: |
        Only messages with a position are exported. Coordinates are `[lon, lat]` (GeoJSON order).
        Each track message is one LineString (or a Point if it has one point). Open the file in QGIS,
        uMap or geojson.io, or load it into MapLibre.
      parameters:
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: type
          in: query
          schema: { type: string, example: "found,hazard,track" }
        - name: channel
          in: query
          description: Only these channels, by name. Comma separated, compared without case.
          schema: { type: string, example: "RescueCodec,draeger-srs" }
      responses:
        "200":
          description: A FeatureCollection.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/FeatureCollection" }
              example:
                type: FeatureCollection
                features:
                  - type: Feature
                    geometry: { type: Point, coordinates: [7.21345, 50.69212] }
                    properties:
                      seq: 42
                      key: a1b2c3d4-7
                      type: found
                      from: "!a1b2c3d4"
                      priority: urgent
                      state: accepted
                      acc: gps
                      channel: RescueCodec
                      to: null
                      time: "2026-11-25T14:32:05Z"
                      text_en: "Person found: child, conscious, hypothermia, fracture, needs stretcher, 2 more helpers needed. Position 50.69212, 7.21345."
                      text_de: "Person gefunden: Kind, ansprechbar, Unterkühlung, Knochenbruch, braucht Trage, 2 weitere Helfer benötigt. Position 50.69212, 7.21345."
                  - type: Feature
                    geometry: { type: LineString, coordinates: [[7.21345, 50.69212], [7.2139, 50.6925], [7.21422, 50.69291]] }
                    properties: { seq: 43, key: null, type: track, from: "!a1b2c3d4", priority: routine, state: null, acc: gps, time: "2026-11-25T14:30:05Z", text_en: "Track: 3 points, 1 min, last at 50.69291, 7.21422. Time 14:30 UTC.", text_de: "Spur: 3 Punkte, 1 Min., zuletzt bei 50.69291, 7.21422. Zeit 14:30 UTC." }

  /v2/encode:
    post:
      tags: [tools]
      operationId: encodeMessage
      summary: Encode without sending. Shows bytes, size and readable text (live byte counter).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { $ref: "#/components/schemas/Message" }
            example:
              message: { id: 7, pos: { lat: 50.69212, lon: 7.21345 }, found: { age: child, consciousness: conscious, injuries: [hypothermia, fracture], needs: [stretcher], responders: 2 } }
      responses:
        "200":
          description: Encoded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncodeResult" }
              example:
                hex: 08071a0908b8e6ea041082875832080841100518012802
                size: 23
                message: { id: 7, pos: { lat: 50.69212, lon: 7.21345 }, found: { consciousness: conscious, age: child, injuries: [hypothermia, fracture], needs: [stretcher], responders: 2 } }
                text:
                  en: "Person found: child, conscious, hypothermia, fracture, needs stretcher, 2 more helpers needed. Position 50.69212, 7.21345."
                  de: "Person gefunden: Kind, ansprechbar, Unterkühlung, Knochenbruch, braucht Trage, 2 weitere Helfer benötigt. Position 50.69212, 7.21345."
                text_size: 122
                airtime_s: { value: 0.6, unit: s, source: estimated, note: "LONG_FAST, 23 B payload + 23 B Meshtastic overhead" }
                text_airtime_s: { value: 1.34, unit: s, source: estimated, note: "Same report as plain English text" }
        "400": { $ref: "#/components/responses/InvalidMessage" }

  /v2/extract:
    post:
      tags: [tools]
      operationId: extractMessage
      summary: Read one typed sentence and show the report it would send. Nothing is sent (live preview).
      description: |
        The rule-based extractor (German and English, spec/SPEC.md section 11) turns a sentence into a report.
        When no report fits, the result is a `text` with the same words (`unsupported: true`, `reason` says why).
        To send the result, post `message` to `POST /v2/messages` (the gateway adds the id), or the words to
        `POST /v2/text` for a plain text. The dashboard composer calls this while the operator types.

        - `coded_bytes`: bytes on air for `message` as it would go out, the id the gateway adds counted. A `text`
          counts like `POST /v2/text` (its UTF-8 bytes with `--text-as-meshtastic on`, the default).
        - `text_bytes`: bytes on air for the same words sent as a plain text.
        - `fields`: the facts of the report as short labels in English and German (chips in a UI). Empty for a text.
        - With `channel` or `to`: `send_as` and `max_text_bytes` of that chat (400 when it packs, else 180), and for a
          text `form` (`plain`, `deflate` or `words`), `cut` (it will be shortened to fit one radio message) and
          `coded_bytes` of the form that would go out (with `--compact-text on` this can be `words`).

        Input is at most 1000 characters. Not limited by `--tx-per-minute`: nothing goes on air.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 1000, description: "One sentence, German or English." }
                lang: { type: string, enum: [en, de], description: "Language of the sentence. Leave it out to detect it." }
                channel: { type: string, description: "Size a text for this chat (channel name)." }
                to: { type: string, pattern: "^![0-9a-f]{8}$", description: "Size a text for a direct chat with this node." }
            example: { text: "Kind gefunden, ansprechbar, unterkühlt. Wir brauchen eine Trage." }
      responses:
        "200":
          description: The report (or text) the sentence gives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractResult" }
              example:
                type: found
                message: { found: { age: child, consciousness: conscious, injuries: [hypothermia], needs: [stretcher] } }
                unsupported: false
                reason: null
                lang: de
                fields:
                  - { field: found.age, code: child, text: { en: child, de: Kind } }
                  - { field: found.consciousness, code: conscious, text: { en: conscious, de: ansprechbar } }
                  - { field: found.injuries, code: hypothermia, text: { en: hypothermia, de: Unterkühlung } }
                  - { field: found.needs, code: stretcher, text: { en: needs stretcher, de: braucht Trage } }
                text:
                  en: "Person found: child, conscious, hypothermia, needs stretcher."
                  de: "Person gefunden: Kind, ansprechbar, Unterkühlung, braucht Trage."
                coded_bytes: 10
                text_bytes: 65
        "400": { $ref: "#/components/responses/InvalidMessage" }

  /v2/decode:
    post:
      tags: [tools]
      operationId: decodeMessage
      summary: Decode a payload (v1 or v2) given as hex. For debugging and integration tests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hex]
              properties:
                hex: { type: string, pattern: "^([0-9a-fA-F]{2})*$" }
            example: { hex: 08071a0908b8e6ea041082875832080841100518012802 }
      responses:
        "200":
          description: Decoded.
          content:
            application/json:
              schema:
                type: object
                required: [v, size, message, text]
                properties:
                  v: { type: integer, enum: [1, 2] }
                  size: { type: integer }
                  message: { $ref: "#/components/schemas/Message" }
                  text: { $ref: "#/components/schemas/Text2" }
        "400": { $ref: "#/components/responses/InvalidMessage" }

  /v2/stream:
    get:
      tags: [read]
      operationId: stream
      summary: "WebSocket: live events (connect with ws://127.0.0.1:8000/v2/stream)."
      description: |
        Upgrade to a WebSocket. Every frame is one JSON object `{"event": <name>, "data": <object>}`
        (schema `StreamEvent`).
        1. Right after connecting you get `hello` with the health and the last `seq`.
        2. If you pass `?since_seq=N`, the gateway first replays every `message` with `seq > N`, oldest
           first, then sends live events. Use it after a reconnect so nothing is lost.
        3. Live events: `message` (new record in or out), `message_status` (an outgoing record changed
           status), `task` (task created or changed, full object), `node` (node heard or changed),
           `stats` (every 10 s), `health` (when radio or MQTT connects or drops).
        Client frames: `{"op": "ping"}` gives `{"event": "pong", "data": {}}`. Anything else is ignored.
        Sending is done over REST, not over the WebSocket.
      parameters:
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "101":
          description: Switching to WebSocket. Frames follow `StreamEvent`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamEvent" }
              examples:
                hello: { value: { event: hello, data: { last_seq: 42, health: { status: ok, version: 2.0.0, spec_version: 2.0.0, uptime_s: 3605, radio: { connected: true, kind: serial, node: "!a1b2c3d4", port: 256, channel: RescueCodec, channel_index: 1, channels: [ { index: 1, name: RescueCodec, public: false } ], region: EU_868, preset: LONG_FAST, firmware: 2.7.26 }, mqtt: { connected: false } } } } }
                message: { value: { event: message, data: {"seq": 42, "key": "a1b2c3d4-7", "direction": "in", "from": "!a1b2c3d4", "type": "found", "priority": "urgent", "status": "received", "error": null, "time": "2026-11-25T14:32:05Z", "event_time": null, "codec": {"version": 2, "size": 23, "hex": "08071a0908b8e6ea041082875832080841100518012802"}, "radio": {"packet_id": 3141592653, "rssi": -97, "snr": 6.25, "hops": 0, "channel": 1, "via": "serial"}, "channel": {"index": 1, "name": "RescueCodec", "public": false}, "to": null, "message": {"id": 7, "pos": {"lat": 50.69212, "lon": 7.21345}, "found": {"consciousness": "conscious", "age": "child", "injuries": ["hypothermia", "fracture"], "needs": ["stretcher"], "responders": 2}}, "text": {"en": "Person found: child, conscious, hypothermia, fracture, needs stretcher, 2 more helpers needed. Position 50.69212, 7.21345.", "de": "Person gefunden: Kind, ansprechbar, Unterkühlung, Knochenbruch, braucht Trage, 2 weitere Helfer benötigt. Position 50.69212, 7.21345."}, "task_key": "a1b2c3d4-7"} } }
                message_status: { value: { event: message_status, data: { seq: 44, status: delivered, error: null, updated: "2026-11-25T14:33:01Z" } } }
                task: { value: { event: task, data: {"key": "a1b2c3d4-7", "from": "!a1b2c3d4", "id": 7, "type": "found", "priority": "urgent", "state": "accepted", "created": "2026-11-25T14:32:05Z", "updated": "2026-11-25T14:33:10Z", "pos": {"lat": 50.69212, "lon": 7.21345}, "text": {"en": "Person found: child, conscious, hypothermia, fracture, needs stretcher, 2 more helpers needed. Position 50.69212, 7.21345.", "de": "Person gefunden: Kind, ansprechbar, Unterkühlung, Knochenbruch, braucht Trage, 2 weitere Helfer benötigt. Position 50.69212, 7.21345."}, "message_seq": 42, "channel": {"index": 1, "name": "RescueCodec", "public": false}, "acks": [{"by": "!0badc0de", "status": "accepted", "eta": 15, "team": "Trupp 3", "time": "2026-11-25T14:33:10Z", "seq": 45}]} } }
        "400":
          description: Not a WebSocket upgrade request.

components:
  parameters:
    TaskKey:
      name: key
      in: path
      required: true
      description: '`<sender node hex>-<id>`, for example `a1b2c3d4-7`.'
      schema: { type: string, pattern: "^[0-9a-f]{8}-[0-9]{1,5}$" }

  responses:
    InvalidMessage:
      description: |
        The message breaks the spec. `error.code` is one of the codec codes from spec/SPEC.md
        (`no_body`, `multiple_bodies`, `unknown_key`, `invalid_value`, `missing_field`, `too_large`,
        `empty`, `malformed`, `unsupported_version`) or `bad_request` (not JSON, wrong shape).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_value, message: "latitude must be -90..90", field: pos.lat } }
    NotFound:
      description: No such record or task.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "no task a1b2c3d4-99", field: null } }
    RadioUnavailable:
      description: No radio connected. Nothing was queued.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: radio_unavailable, message: "no Meshtastic radio connected", field: null } }
    AirtimeLimit:
      description: |
        The legal airtime budget (10% per hour on 869.4-869.65 MHz) is used up. Nothing was queued,
        except a mayday, which is always queued. `retry_after_s` says when to try again.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: airtime_limit, message: "airtime budget used, send again in 4 min", field: null, retry_after_s: 240 } }

  schemas:
    # ------------------------------------------------------------ canonical message JSON
    Message:
      description: |
        Canonical JSON of one RescueCodec message (spec/SPEC.md). Exactly one body key:
        found, track, sector, request, hazard, mayday, ack, text. Decoded messages from a newer spec
        may have the body key `unknown` instead. Zero or "not stated" values are left out.
      type: object
      additionalProperties: false
      properties:
        v: { type: integer, enum: [1, 2], description: "Set on decoded messages only: 1 = old v1 packet." }
        id: { type: integer, minimum: 0, maximum: 16383, description: "Per-sender counter. Required for found, request, hazard, mayday (the gateway fills it when sending)." }
        priority: { $ref: "#/components/schemas/Priority" }
        pos: { $ref: "#/components/schemas/Position" }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Minute of the UTC day when it happened, HH:MM." }
        v1_timestamp: { type: integer, description: "v1 packets only: Unix seconds." }
        found: { $ref: "#/components/schemas/Found" }
        track: { $ref: "#/components/schemas/Track" }
        sector: { $ref: "#/components/schemas/Sector" }
        request: { $ref: "#/components/schemas/Request" }
        hazard: { $ref: "#/components/schemas/Hazard" }
        mayday: { $ref: "#/components/schemas/Mayday" }
        ack: { $ref: "#/components/schemas/Ack" }
        text: { $ref: "#/components/schemas/TextBody" }
        unknown:
          type: object
          additionalProperties: false
          description: "Body of a newer type this gateway does not know. `words` is set for a compact text whose word dictionary this gateway does not have (shown as \"dictionary this app does not have\", never as words)."
          properties:
            words: { type: integer, minimum: 1 }
      oneOf:
        - required: [found]
        - required: [track]
        - required: [sector]
        - required: [request]
        - required: [hazard]
        - required: [mayday]
        - required: [ack]
        - required: [text]
        - required: [unknown]
      example:
        id: 7
        pos: { lat: 50.69212, lon: 7.21345 }
        found: { age: child, consciousness: conscious, injuries: [hypothermia, fracture], needs: [stretcher], responders: 2 }
    Priority:
      type: string
      description: "Left out = the default for the type (mayday critical; found, hazard, ack urgent; request, text normal; sector, track routine). Values unknown_<n> come from newer senders."
      enum: [routine, normal, urgent, critical]
    MessageType:
      type: string
      enum: [found, track, sector, request, hazard, mayday, ack, text, unknown]
    Position:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, description: "Degrees, 5 decimals are kept." }
        lon: { type: number, minimum: -180, maximum: 180 }
        acc: { type: string, enum: [gps, gps_poor, estimated, area], description: "Left out = gps." }
    Found:
      type: object
      additionalProperties: false
      properties:
        count: { type: integer, minimum: 1, maximum: 255, description: "Persons found." }
        age: { type: string, enum: [child, teen, adult, senior] }
        consciousness: { type: string, enum: [conscious, confused, unconscious] }
        breathing: { type: string, enum: [normal, difficult, none] }
        mobility: { type: string, enum: [walks, cannot_walk, trapped] }
        injuries:
          type: array
          uniqueItems: true
          items: { type: string, enum: [hypothermia, bleeding, fracture, head, spine, exhaustion, other, cardiac, heat, burn, allergy] }
        needs:
          type: array
          uniqueItems: true
          items: { type: string, enum: [stretcher, medic, helicopter, warmth, water, vehicle, other, aed, oxygen, first_aid, rope, light, food, radio] }
        responders: { type: integer, minimum: 1, maximum: 255, description: "More helpers needed on site." }
    Track:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 16
          description: Oldest first. Give `s` on every point or on none. With `s`, the message needs `time`.
          items:
            type: object
            additionalProperties: false
            required: [lat, lon]
            properties:
              lat: { type: number, minimum: -90, maximum: 90 }
              lon: { type: number, minimum: -180, maximum: 180 }
              s: { type: integer, minimum: 0, maximum: 86400, description: "Seconds after the message time minute. Never goes down." }
    Sector:
      type: object
      additionalProperties: false
      required: [sector, status]
      properties:
        sector: { type: integer, minimum: 1, maximum: 65535 }
        status: { type: string, enum: [cleared, partial, blocked] }
        coverage: { type: integer, minimum: 1, maximum: 100, description: Percent searched. }
    Request:
      type: object
      additionalProperties: false
      required: [resource]
      properties:
        resource: { type: string, enum: [stretcher, medic, helicopter, vehicle, searchers, dog_team, drone, light, water, food, warmth, batteries, rope_team, ambulance, fire_brigade, other] }
        count: { type: integer, minimum: 1, maximum: 255 }
        urgency: { type: string, enum: [now, soon, later] }
    Hazard:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [blocked_path, rockfall, water, fire, cliff, ice, animal, power_line, hunting, weather, other] }
        severity: { type: string, enum: [low, medium, high] }
        radius: { type: integer, minimum: 1, maximum: 100000, description: Metres around the position. }
    Mayday:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, enum: [injured, lost, missing_member, medical, trapped, threat, other] }
        persons: { type: integer, minimum: 1, maximum: 255 }
    Ack:
      type: object
      additionalProperties: false
      required: [ref, status]
      properties:
        ref: { type: integer, minimum: 1, maximum: 16383, description: "Id of the answered message. Values above 16383 only appear in decoded v1 packets." }
        node: { type: string, pattern: "^![0-9a-f]{8}$", description: "Sender of the answered message. Always set in v2; missing in decoded v1 packets." }
        status: { type: string, enum: [accepted, declined, done] }
        eta: { type: integer, minimum: 1, maximum: 1440, description: Minutes until arrival. }
        team: { type: string, description: "Team label, at most 12 bytes UTF-8, no personal names." }
    TextBody:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, description: "1..180 bytes of UTF-8. In a record of a plain Meshtastic text (`codec.version: 0`) up to 233 bytes, as the sender typed it. In a packed text up to 1024 bytes." }
        dict: { type: integer, minimum: 1, description: "Set when the words came or went packed (DEFLATE with text dictionary `dict`, SPEC section 3.5). The words are always unpacked here." }
        words: { type: integer, minimum: 1, description: "Set when the words came or went as a compact text (word tokens with word dictionary `words`, SPEC section 3.6). The words are always decoded here, exactly as typed." }
    Text2:
      type: object
      description: The message as one readable line, built from the spec templates.
      required: [en, de]
      properties:
        en: { type: string }
        de: { type: string }

    # ------------------------------------------------------------ gateway objects
    SendRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        want_ack:
          type: boolean
          default: true
          description: Ask Meshtastic for a delivery acknowledgement (status moves to delivered or failed).
        dry_run:
          type: boolean
          default: false
          description: Validate and return the record without sending. `seq` is 0 and status `dry_run`.
        channel:
          type: string
          description: "Channel name to send on (see `GET /v2/health` -> `radio.channels`). Default: the default channel (`--channel-name`). Reports never go out on a public channel."
          example: draeger-srs
        to:
          type: string
          pattern: "^![0-9a-f]{8}$"
          description: "Send a text as a direct message to this node: packed when the node runs RescueCodec (port 256 to that node), else a normal Meshtastic text (port 1). Leave it out for the whole channel."
    Channel:
      type: object
      description: |
        A Meshtastic channel. Known by its `name` (the index can differ between radios). An empty primary name shows
        as the modem preset's name, for example "LongFast". `public` = no key or the default key: anyone can read it.
      required: [index, name, public]
      properties:
        index: { type: integer, minimum: 0, maximum: 7, description: Index on the gateway's radio. }
        name: { type: string, example: RescueCodec }
        public: { type: boolean }
    AckRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [accepted, declined, done] }
        eta: { type: integer, minimum: 1, maximum: 1440 }
        team: { type: string, description: "At most 12 bytes UTF-8. Default: the gateway's configured label." }
    MessageRecord:
      type: object
      description: One message the gateway received or sent.
      required: [seq, key, direction, from, type, priority, status, time, event_time, codec, radio, channel, to, message, text, task_key]
      properties:
        seq: { type: integer, minimum: 0, description: "Gateway-local number, increases by one per record. 0 only for dry runs." }
        key: { type: [string, "null"], description: "`<node hex>-<id>` if the message has an id, else null." }
        direction: { type: string, enum: [in, out] }
        from: { type: string, pattern: "^![0-9a-f]{8}$", description: Meshtastic sender node. For outgoing records the gateway radio. }
        type: { $ref: "#/components/schemas/MessageType" }
        priority: { type: string, enum: [routine, normal, urgent, critical], description: "Effective priority (type default filled in)." }
        status:
          type: string
          enum: [received, queued, sent, delivered, failed, dry_run]
          description: "in: always received. out: queued -> sent -> delivered | failed."
        error: { type: [string, "null"], description: "Why an outgoing message failed, for example no_ack or airtime_limit." }
        time: { type: string, format: date-time, description: Gateway clock when received or queued. }
        event_time: { type: [string, "null"], format: date-time, description: "`message.time` resolved to a full UTC date-time, or null." }
        codec:
          type: object
          required: [version, size, hex]
          properties:
            version:
              type: integer
              enum: [0, 1, 2]
              description: "2 = RescueCodec v2, 1 = v1. 0 = a plain Meshtastic text (port 1, TEXT_MESSAGE_APP), not a RescueCodec packet: `hex` is the UTF-8 text, `type` is `text`, there is no id and no task, and a received one can be up to 233 bytes. A UI can show it with a small \"via Meshtastic\" hint."
            size: { type: integer, description: "Payload bytes (measured)." }
            hex: { type: string }
            packed: { type: boolean, description: "Present and true for a packed text (DEFLATE with the shared dictionary, or compact word tokens). `message.text.text` holds the unpacked words." }
            form: { type: string, enum: [deflate, words], description: "With packed: deflate (SPEC 3.5) or words (compact text, SPEC 3.6)." }
        radio:
          type: [object, "null"]
          description: Radio facts for received packets (measured). Null for outgoing records.
          properties:
            packet_id: { type: integer }
            rssi: { type: [integer, "null"] }
            snr: { type: [number, "null"] }
            hops: { type: [integer, "null"], description: "hop_start - hop_limit, if the firmware reports both." }
            channel: { type: integer, description: Channel index. }
            via: { type: string, enum: [serial, tcp, ble, sim] }
        channel:
          $ref: "#/components/schemas/Channel"
          description: "The channel it came in on or went out on. For a direct message: the channel the radio used for it."
        to:
          type: [string, "null"]
          pattern: "^![0-9a-f]{8}$"
          description: "Direct messages only: the peer we sent to (out), or our own node (in). Null for a broadcast on the channel."
        message: { $ref: "#/components/schemas/Message" }
        text: { $ref: "#/components/schemas/Text2" }
        task_key: { type: [string, "null"], description: "The task this record belongs to: its own key for found/request/hazard/mayday, the answered task for an ack, else null." }
    Task:
      type: object
      required: [key, from, id, type, priority, state, created, updated, pos, text, message_seq, channel, acks]
      properties:
        key: { type: string, example: a1b2c3d4-7 }
        from: { type: string, pattern: "^![0-9a-f]{8}$" }
        id: { type: integer }
        type: { type: string, enum: [found, request, hazard, mayday] }
        priority: { type: string, enum: [routine, normal, urgent, critical] }
        state:
          type: string
          enum: [open, accepted, declined, done]
          description: From the acks, using the newest answer of each node (SPEC section 15). Done from anyone is final. Else accepted while any team still has it accepted, else declined, else open. A declined task can still be accepted by another team.
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        pos: { oneOf: [ { $ref: "#/components/schemas/Position" }, { type: "null" } ] }
        text: { $ref: "#/components/schemas/Text2" }
        message_seq: { type: integer, description: Record that created the task. }
        channel:
          $ref: "#/components/schemas/Channel"
          description: The channel of the report. Answers to this task go out on it.
        acks:
          type: array
          description: Every ack seen for this task, oldest first (ours and other teams').
          items:
            type: object
            required: [by, status, time, seq]
            properties:
              by: { type: string, pattern: "^![0-9a-f]{8}$", description: Node that sent the ack. }
              status: { type: string, enum: [accepted, declined, done] }
              eta: { type: [integer, "null"] }
              team: { type: [string, "null"] }
              time: { type: string, format: date-time }
              seq: { type: integer }
    Metric:
      type: object
      required: [value, unit, source]
      properties:
        value: { type: [number, "null"] }
        unit: { type: string, example: B }
        source: { type: string, enum: [measured, estimated] }
        note: { type: string }
    Stats:
      type: object
      required: [since, messages_in, messages_out, bytes_in, bytes_out, text_equivalent_bytes, size_ratio, airtime_out_s, airtime_last_hour_pct, airtime_limit_pct, last_rssi, last_snr, by_type]
      properties:
        since: { type: string, format: date-time }
        messages_in: { $ref: "#/components/schemas/Metric" }
        messages_out: { $ref: "#/components/schemas/Metric" }
        bytes_in: { $ref: "#/components/schemas/Metric" }
        bytes_out: { $ref: "#/components/schemas/Metric" }
        text_equivalent_bytes: { $ref: "#/components/schemas/Metric", description: "Bytes the same messages would need as English text (text.en)." }
        size_ratio: { $ref: "#/components/schemas/Metric", description: "text_equivalent_bytes / (bytes_in + bytes_out)." }
        airtime_out_s: { $ref: "#/components/schemas/Metric" }
        airtime_last_hour_pct: { $ref: "#/components/schemas/Metric", description: "Our own transmit time in the last 60 min, percent." }
        airtime_limit_pct: { $ref: "#/components/schemas/Metric" }
        last_rssi: { $ref: "#/components/schemas/Metric" }
        last_snr: { $ref: "#/components/schemas/Metric" }
        by_type:
          type: object
          additionalProperties:
            type: object
            required: [count, bytes]
            properties:
              count: { type: integer }
              bytes: { type: integer }
    Node:
      type: object
      required: [node, num, last_heard, is_gateway]
      properties:
        node: { type: string, pattern: "^![0-9a-f]{8}$" }
        num: { type: integer, minimum: 0, maximum: 4294967295 }
        short_name: { type: [string, "null"] }
        long_name: { type: [string, "null"], description: As set on the radio. Ask teams to use team labels, not personal names. }
        hw_model: { type: [string, "null"] }
        role: { type: [string, "null"] }
        last_heard: { type: [string, "null"], format: date-time }
        rssi: { type: [integer, "null"] }
        snr: { type: [number, "null"] }
        hops_away: { type: [integer, "null"] }
        battery_pct: { type: [integer, "null"] }
        pos: { oneOf: [ { $ref: "#/components/schemas/Position" }, { type: "null" } ] }
        is_gateway: { type: boolean }
        rescuecodec: { type: boolean, description: "The node sent a RescueCodec packet (port 256) in the last 24 h, or is the gateway. Direct texts to it go packed in mode auto." }
    ChatMode:
      type: object
      description: How a text in one chat (a channel or a direct chat) goes out now. SPEC section 2.3.
      required: [channel, node, mode, own_mode, send_as, reason, meshtastic_users, rescuecodec_nodes]
      properties:
        channel: { type: [string, "null"], description: "Channel name, null for a direct chat." }
        node: { type: [string, "null"], pattern: "^![0-9a-f]{8}$", description: "Peer of a direct chat, else null." }
        mode: { type: string, enum: [auto, compressed, normal] }
        own_mode: { type: boolean, description: "false = the chat follows the gateway default (--text-mode)." }
        send_as: { type: string, enum: [compressed, normal], description: "compressed = packed for RescueCodec when it saves at least 3 bytes; short texts still go normal." }
        reason:
          type: string
          enum: [public_channel, mode_normal, mode_compressed, peer_rescuecodec, peer_unknown, meshtastic_users, rescuecodec_only, nobody_known]
        meshtastic_users: { type: array, items: { type: string }, description: "Nodes that sent normal texts on this channel and no RescueCodec packet in the last 24 h." }
        rescuecodec_nodes: { type: array, items: { type: string }, description: "Nodes that sent RescueCodec packets here in the last 24 h." }
    ModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: [string, "null"], enum: [auto, compressed, normal, null], description: "null = follow the gateway default again." }
    Health:
      type: object
      required: [status, version, spec_version, uptime_s, radio, mqtt]
      properties:
        status: { type: string, enum: [ok, degraded], description: "degraded = running, but no radio." }
        version: { type: string, description: Gateway version. }
        spec_version: { type: string, example: 2.1.0 }
        uptime_s: { type: integer }
        radio:
          type: object
          required: [connected, kind, node, port]
          properties:
            connected: { type: boolean }
            kind: { type: string, enum: [serial, tcp, ble, sim, none] }
            node: { type: [string, "null"] }
            port: { type: integer, description: Meshtastic port number used, 256 = PRIVATE_APP. }
            channel: { type: [string, "null"], description: Name of the default channel for sending (used when a request names no channel). }
            channel_index: { type: [integer, "null"], description: Meshtastic index of that channel. }
            channels:
              type: array
              description: "Every channel the gateway listens on (all private ones or the ones in --channels, public ones only with --show-public), the default one included. Direct messages to our node are kept on any channel. `mode` and `send_as` say how a text goes out there now (see `GET /v2/channels/{name}/mode`)."
              items:
                allOf:
                  - { $ref: "#/components/schemas/Channel" }
                  - type: object
                    properties:
                      mode: { type: string, enum: [auto, compressed, normal] }
                      send_as: { type: string, enum: [compressed, normal] }
            channel_error: { type: [string, "null"], description: "Why there is no safe default channel (none named RescueCodec, only the public key). Sending without a `channel` is refused while this is set." }
            other_channel: { type: integer, description: Port 256 packets dropped because they came in on a channel we do not listen on. }
            region: { type: [string, "null"] }
            preset: { type: [string, "null"] }
            firmware: { type: [string, "null"] }
        mqtt:
          type: object
          required: [connected]
          properties:
            connected: { type: boolean }
        compact_text: { type: boolean, description: "--compact-text: chats that pack may send compact word-token texts (SPEC section 3.6)." }
        text_limits:
          type: object
          description: "Bytes of UTF-8 a sent text may have: `text` in a chat that does not pack, `packed` in one that packs."
          properties:
            text: { type: integer, example: 180 }
            packed: { type: integer, example: 400 }
    EncodeResult:
      type: object
      required: [hex, size, message, text, text_size, airtime_s, text_airtime_s]
      properties:
        hex: { type: string }
        size: { type: integer, description: Payload bytes (measured). }
        message: { $ref: "#/components/schemas/Message", description: "Canonical form (what the receiver will decode)." }
        text: { $ref: "#/components/schemas/Text2" }
        text_size: { type: integer, description: "UTF-8 bytes of text.en." }
        airtime_s: { $ref: "#/components/schemas/Metric" }
        text_airtime_s: { $ref: "#/components/schemas/Metric" }
    ExtractResult:
      type: object
      required: [type, message, unsupported, reason, lang, fields, text, coded_bytes, text_bytes]
      properties:
        type: { type: string, enum: [found, sector, request, hazard, mayday, text] }
        message: { $ref: "#/components/schemas/Message", description: "Canonical message without an id. Post it to /v2/messages to send it." }
        unsupported: { type: boolean, description: "true = no report fits the sentence; message is a text with the same words." }
        reason: { type: [string, "null"], description: "Why no report fits: empty, no_supported_type, conflicting_states, object_found, missing_field, ambiguous, invalid." }
        lang: { type: string, enum: [en, de, unknown] }
        fields:
          type: array
          items:
            type: object
            required: [field, code, text]
            properties:
              field: { type: string, description: "For example found.age, request.resource, priority, pos." }
              code: { type: [string, integer] }
              text: { $ref: "#/components/schemas/Text2" }
        text: { $ref: "#/components/schemas/Text2" }
        coded_bytes: { type: integer, description: "Bytes on air for message (measured by encoding it)." }
        text_bytes: { type: integer, description: "Bytes on air for the same words as a plain text." }
        send_as: { type: string, enum: [compressed, normal], description: "Only with channel or to: how a text goes out in that chat." }
        max_text_bytes: { type: integer, enum: [180, 400], description: "Only with channel or to: the text limit of that chat." }
        form: { type: string, enum: [plain, deflate, words], description: "Only for a text with channel or to: the form that would go out." }
        cut: { type: boolean, description: "Only for a text with channel or to: the text is too long and will be cut to fit one radio message." }
    StreamEvent:
      type: object
      required: [event, data]
      properties:
        event: { type: string, enum: [hello, message, message_status, task, node, stats, health, pong] }
        data:
          description: |
            hello: {last_seq, health}. message: MessageRecord. message_status: {seq, status, error, updated}.
            task: Task. node: Node. stats: Stats. health: Health. pong: {}.
          oneOf:
            - type: object
              required: [last_seq, health]
              properties:
                last_seq: { type: integer }
                health: { $ref: "#/components/schemas/Health" }
            - $ref: "#/components/schemas/MessageRecord"
            - type: object
              required: [seq, status, updated]
              properties:
                seq: { type: integer }
                status: { type: string, enum: [queued, sent, delivered, failed] }
                error: { type: [string, "null"] }
                updated: { type: string, format: date-time }
            - $ref: "#/components/schemas/Task"
            - $ref: "#/components/schemas/Node"
            - $ref: "#/components/schemas/Stats"
            - $ref: "#/components/schemas/Health"
            - type: object
              maxProperties: 0
    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { const: Feature }
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type: { type: string, enum: [Point, LineString] }
                  coordinates: { type: array }
              properties:
                type: object
                required: [seq, key, type, from, priority, state, acc, time, text_en, text_de]
                properties:
                  seq: { type: integer }
                  key: { type: [string, "null"] }
                  type: { $ref: "#/components/schemas/MessageType" }
                  from: { type: string }
                  priority: { type: string }
                  state: { type: [string, "null"], description: Task state, null for non-tasks. }
                  acc: { type: string, enum: [gps, gps_poor, estimated, area] }
                  channel: { type: [string, "null"], description: Channel name. }
                  to: { type: [string, "null"], description: Peer of a direct message, else null. }
                  time: { type: string, format: date-time, description: "event_time if known, else time." }
                  text_en: { type: string }
                  text_de: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, field]
          properties:
            code:
              type: string
              description: |
                Codec codes: empty, too_large, unsupported_version, malformed, no_body, multiple_bodies,
                unknown_key, invalid_value, missing_field. Gateway codes: bad_request, not_found,
                invalid_transition, radio_unavailable, airtime_limit, rate_limited, unauthorized.
            message: { type: string, description: Plain English for people. }
            field: { type: [string, "null"], description: "Path of the bad field, for example pos.lat." }
            retry_after_s: { type: integer, description: Only for airtime_limit and rate_limited. }

  examples:
    InFoundRecord:
      value:
        seq: 42
        key: a1b2c3d4-7
        direction: in
        from: "!a1b2c3d4"
        type: found
        priority: urgent
        status: received
        error: null
        time: "2026-11-25T14:32:05Z"
        event_time: null
        codec: { version: 2, size: 23, hex: 08071a0908b8e6ea041082875832080841100518012802 }
        radio: { packet_id: 3141592653, rssi: -97, snr: 6.25, hops: 0, channel: 1, via: serial }
        channel: { index: 1, name: RescueCodec, public: false }
        to: null
        message: { id: 7, pos: { lat: 50.69212, lon: 7.21345 }, found: { consciousness: conscious, age: child, injuries: [hypothermia, fracture], needs: [stretcher], responders: 2 } }
