        radio: null
        channel: { index: 1, name: RescueCodec, public: false }
        to: null
        message: { id: 12, pos: { lat: 50.69212, lon: 7.21345 }, found: { consciousness: conscious, age: child, injuries: [hypothermia, fracture], needs: [stretcher], responders: 2 } }
